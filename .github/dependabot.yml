version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 8
    groups:
      github-actions:
        patterns:
          - "*"

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 8
    groups:
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
      angular-dependencies:
        patterns:
          - "@angular/*"
